packages:
  - "playground"
  - "playground-v5"

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  simple-git-hooks: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@nuxt/*'
  - nuxt-nightly

overrides:
  "@nuxt/kit@<5": "^4.6.0"
  "@nuxt/schema@<5": "4.6.2"
  nuxt-workers: "workspace:*"
